[package]
name = "ousia-rust-checker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "ousia_rust_checker"
path = "src/lib.rs"

[[bin]]
name = "ousia-rust-checker"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.21"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "3", features = ["full", "parsing", "visit"] }

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }

[profile.dev]
opt-level = 1
